[project]
name = "cno-sdk"
version = "0.1.0"
description = "Low-level protocol client for codenames.game (boardgame.io + Socket.IO)"
requires-python = ">=3.11"
dependencies = [
    "python-socketio[asyncio-client]>=5.11.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cno_sdk"
