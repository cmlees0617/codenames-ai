[project]
name = "cno"
version = "0.1.0"
description = "CLI and high-level bot client for codenames.game spymasters"
requires-python = ">=3.11"
dependencies = ["cno-sdk"]

[project.scripts]
cno = "cno.cli:main"

[tool.uv.sources]
cno-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cno"
