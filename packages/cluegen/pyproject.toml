[project]
name = "cluegen"
version = "0.1.0"
description = "Example embedding-based ClueAlgorithm and guess engines (optional)"
requires-python = ">=3.12"
dependencies = [
    "game-core",
    "numpy",
    "sentence-transformers",
    "scikit-learn",
    "nltk",
    "wordfreq",
    "transformers>=5.9.0",
    "accelerate>=1.13.0",
    "matplotlib>=3.8",
]

[tool.uv.sources]
game-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cluegen"
