[project]
name = "cluegen"
version = "0.1.0"
description = "Offline Codenames spymaster clue generation using semantic embeddings"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sentence-transformers",
    "scikit-learn",
    "nltk",
    "wordfreq",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cluegen"
