[project]
name = "clue-eval"
version = "0.1.0"
description = "Model-agnostic tools for testing and benchmarking Codenames clue algorithms"
requires-python = ">=3.12"
dependencies = [
    "game-core",
    "numpy",
]

[project.optional-dependencies]
embeddings = [
    "gensim>=4.3.2",
]

[project.scripts]
clue-eval-embed = "clue_eval.embeddings.generate:main"

[tool.uv.sources]
game-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clue_eval"
