[project]
name = "cno"
version = "0.1.0"
description = "CLI entrypoint for codenames.game bots"
requires-python = ">=3.12"
dependencies = ["cno-bots", "questionary>=2.0.0"]

[project.scripts]
cno = "cno.cli:main"

[tool.uv.sources]
cno-bots = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cno"
